name: Deploy Demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'demo/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
      - 'index.html'
  workflow_run:
    workflows: ['CI/CD']
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy Demo
    runs-on: ubuntu-latest
    # Only run if workflow_run completed successfully or if it's a direct push
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Extract package version
        id: extract_version
        run: echo "PACKAGE_VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV

      - name: Replace local scripts with CDN links in demo pages
        run: |
          find demo -name "*.html" -exec sed -i "s|\.\./dist/natural-sticky\.top\.min\.js|https://cdn.jsdelivr.net/npm/natural-sticky@${PACKAGE_VERSION}/dist/natural-sticky.top.min.js|g" {} +
          find demo -name "*.html" -exec sed -i "s|\.\./dist/natural-sticky\.bottom\.min\.js|https://cdn.jsdelivr.net/npm/natural-sticky@${PACKAGE_VERSION}/dist/natural-sticky.bottom.min.js|g" {} +

      - name: Clean up unnecessary files for GitHub Pages
        run: |
          # Create a temporary directory for files we want to keep
          mkdir -p /tmp/pages-content

          # Copy only the files and directories we want to keep
          cp index.html /tmp/pages-content/ 2>/dev/null || true
          cp 404.html /tmp/pages-content/ 2>/dev/null || true
          cp robots.txt /tmp/pages-content/ 2>/dev/null || true
          cp llms.txt /tmp/pages-content/ 2>/dev/null || true
          cp -r demo /tmp/pages-content/ 2>/dev/null || true
          cp -r dist /tmp/pages-content/ 2>/dev/null || true

          # Remove everything in current directory
          rm -rf .* * 2>/dev/null || true

          # Move back only what we want to keep
          mv /tmp/pages-content/* . 2>/dev/null || true

          # Clean up temp directory
          rm -rf /tmp/pages-content

      - name: Generate sitemap
        id: sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://github.kadykov.com/natural-sticky/
          include-html: true
          include-pdf: false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
