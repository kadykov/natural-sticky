<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimal Footer Floating Test</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        /* REQUIRED: position: relative is mandatory for bottom script floating elements (reserveSpace: false) */
        /* This ensures predictable coordinate system for absolute positioning calculations */
        position: relative;
      }

      main {
        height: 2000px;
        padding: 20px;
      }

      /* Main footer that reserves space */
      footer {
        background-color: #333;
        color: white;
        text-align: center;
        padding: 20px;
      }

      /* Floating action button container */
      .action-container {
        padding-bottom: 80px; /* Above footer */
        width: 100%;
        display: flex;
        justify-content: flex-end;
        position: absolute;
        bottom: 0;
      }

      .floating-action {
        width: 60px;
        height: 60px;
        background: #667eea;
        border-radius: 50%;
        border: none;
        color: white;
        font-size: 24px;
        margin-right: 30px;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Scroll Test Content</h1>
      <p>
        Tests footer (reserveSpace: true) + floating button (reserveSpace:
        false)
      </p>
      <p>This content is 2000px tall to enable scrolling.</p>
      <p>Scroll down to see footer, then up to test hiding...</p>
    </main>

    <!-- Floating action button with reserveSpace: false -->
    <div class="action-container" id="actionContainer">
      <button class="floating-action">🚀</button>
    </div>

    <!-- Main footer with reserveSpace: true -->
    <footer id="footer">Main Footer</footer>

    <script src="../dist/natural-sticky.bottom.min.js"></script>
    <script>
      // Main footer - reserves space
      naturalStickyBottom(document.getElementById('footer'), {
        reserveSpace: true,
      });

      // Floating action button - no space reserved
      naturalStickyBottom(document.getElementById('actionContainer'), {
        reserveSpace: false,
      });
    </script>
  </body>
</html>
