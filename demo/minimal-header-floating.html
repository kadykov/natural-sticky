<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimal Header Floating Test</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      /* Main header that reserves space */
      header {
        background-color: #333;
        color: white;
        text-align: center;
        padding: 20px;
      }

      main {
        height: 2000px;
        padding: 20px;
      }

      /* Floating button container */
      .button-container {
        padding-top: 80px; /* Below header */
        width: 100%;
        display: flex;
        justify-content: flex-end;
        position: absolute;
        top: 0;
      }

      .floating-button {
        width: 60px;
        height: 60px;
        background: #ff6b6b;
        border-radius: 50%;
        border: none;
        color: white;
        font-size: 24px;
        cursor: pointer;
        margin-right: 30px;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <!-- Main header with reserveSpace: true -->
    <header id="header">Main Header</header>

    <!-- Floating button with reserveSpace: false -->
    <div class="button-container" id="buttonContainer">
      <button class="floating-button">⭐</button>
    </div>

    <main>
      <h1>Scroll Test Content</h1>
      <p>
        Tests header (reserveSpace: true) + floating button (reserveSpace:
        false)
      </p>
      <p>This content is 2000px tall to enable scrolling.</p>
      <p>Scroll up and down to test the behavior...</p>
    </main>

    <script src="../dist/natural-sticky.top.min.js"></script>
    <script>
      // Main header - reserves space
      naturalStickyTop(document.getElementById('header'), {
        reserveSpace: true,
      });

      // Floating button - no space reserved
      naturalStickyTop(document.getElementById('buttonContainer'), {
        reserveSpace: false,
      });
    </script>
  </body>
</html>
