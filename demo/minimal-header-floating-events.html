<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimal Header Floating Events Test</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      /* Main header that reserves space */
      header {
        background-color: #333;
        color: white;
        text-align: center;
        padding: 20px;
      }

      main {
        height: 2000px;
        padding: 20px;
      }

      /* Floating button container */
      .button-container {
        padding-top: 80px; /* Below header */
        width: 100%;
        display: flex;
        justify-content: flex-end;
        position: absolute;
        top: 0;
      }

      .floating-button {
        width: 120px; /* Wider to show text */
        height: 60px;
        background: #ff6b6b;
        border-radius: 30px; /* Pill shape */
        border: none;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-right: 30px;
        z-index: 1000;
        transition: background-color 0.3s ease;
      }

      /* State-specific styles for floating button */
      .floating-button.home {
        background-color: #4a90e2; /* Blue */
      }
      .floating-button.sticky {
        background-color: #50e3c2; /* Teal */
      }
      .floating-button.relative {
        background-color: #f5a623; /* Orange */
      }
    </style>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <!-- Main header with reserveSpace: true -->
    <header id="header">Main Header</header>

    <!-- Floating button with reserveSpace: false -->
    <div class="button-container" id="buttonContainer">
      <button class="floating-button" id="floatingButton">State: home</button>
    </div>

    <main>
      <h1>Scroll Test Content</h1>
      <p>
        Tests a floating button (reserveSpace: false) with the new event system.
      </p>
      <p>Scroll up and down to test the behavior...</p>
    </main>

    <script src="./dist/natural-sticky.top.min.js"></script>
    <script>
      // Main header - reserves space (standard behavior)
      naturalStickyTop(document.getElementById('header'));

      // Floating button - no space reserved
      const buttonContainer = document.getElementById('buttonContainer');
      const floatingButton = document.getElementById('floatingButton');
      naturalStickyTop(buttonContainer, {
        reserveSpace: false,
      });

      // Listen for state changes on the floating button's container
      buttonContainer.addEventListener('natural-sticky', event => {
        const state = event.detail.state;
        console.log('Floating button state changed to:', state);

        // Update text content
        floatingButton.textContent = `State: ${state}`;

        // Update class for styling
        floatingButton.classList.remove('home', 'sticky', 'relative');
        floatingButton.classList.add(state);
      });

      // Set initial state on load
      floatingButton.classList.add('home');
    </script>
  </body>
</html>
